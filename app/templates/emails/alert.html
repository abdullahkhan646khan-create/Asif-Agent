<!doctype html>
<html>
<body style="margin:0;padding:0;background:#EEF2F8;font-family:Arial,Helvetica,sans-serif;color:#1F2A44;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF2F8;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden;">
  <tr><td style="background:#B45309;padding:18px 24px;color:#ffffff;font-size:15px;"><b>{{ brand.name }}</b> · Action needed</td></tr>
  <tr><td style="padding:22px 24px 8px;font-size:19px;font-weight:bold;">{{ heading }}</td></tr>
  <tr><td style="padding:4px 24px 12px;font-size:14px;line-height:1.6;">
    <ol style="padding-left:18px;margin:0;">{% for line in lines %}<li style="margin-bottom:6px;">{{ line }}</li>{% endfor %}</ol>
  </td></tr>
  <tr><td style="padding:6px 24px 24px;">
    <a href="{{ dashboard_url }}" style="display:inline-block;background:#1F3566;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:10px;">Open the dashboard</a>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
