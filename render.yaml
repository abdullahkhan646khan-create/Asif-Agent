# Render Blueprint: New → Blueprint → pick this repo. Then fill the secret values in the Environment tab.
services:
  - type: web
    name: amanasoft-post-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: EMAIL_MODE
        value: apps_script
      - key: PUBLISH_MODE
        value: shareNow
      - key: DRY_RUN_PUBLISH
        value: "false"
      - key: APP_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_A_1PSID
        sync: false
      - key: GEMINI_A_1PSIDTS
        sync: false
      - key: GEMINI_B_1PSID
        sync: false
      - key: GEMINI_B_1PSIDTS
        sync: false
      - key: GEMINI_C_1PSID
        sync: false
      - key: GEMINI_C_1PSIDTS
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: REVIEW_EMAIL_TO
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_CHANNEL_IDS
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: GEMINI_PROXY
        sync: false
